<!-- Interactive Before/After Split Drag Script -->
<script>
    (function initSlider() {
      const card = document.getElementById('slider-card');
      const clipContainer = document.getElementById('before-clip-container');
      const divider = document.getElementById('slider-divider');
      const photoRef = document.getElementById('before-photo-reference');

      if (!card || !clipContainer || !divider) return;

      function updateDimensions() {
        if (photoRef && card) {
          photoRef.style.width = card.offsetWidth + 'px';
          photoRef.style.height = card.offsetHeight + 'px';
        }
      }

      window.addEventListener('resize', updateDimensions);
      setTimeout(updateDimensions, 50);

      let isDragging = false;

      function setPosition(xPos) {
        const rect = card.getBoundingClientRect();
        let percentage = ((xPos - rect.left) / rect.width) * 100;
        if (percentage < 5) percentage = 5;
        if (percentage > 95) percentage = 95;

        clipContainer.style.width = percentage + '%';
        divider.style.left = percentage + '%';
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        setPosition(clientX);
      }

      function onPointerUp() {
        isDragging = false;
        window.removeEventListener('mousemove', onPointerMove);
        window.removeEventListener('mouseup', onPointerUp);
        window.removeEventListener('touchmove', onPointerMove);
        window.removeEventListener('touchend', onPointerUp);
      }

      function onPointerDown(e) {
        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        setPosition(clientX);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchmove', onPointerMove, { passive: false });
        window.addEventListener('touchend', onPointerUp);
      }

      card.addEventListener('mousedown', onPointerDown);
      card.addEventListener('touchstart', onPointerDown, { passive: true });
    })();
  </script>
