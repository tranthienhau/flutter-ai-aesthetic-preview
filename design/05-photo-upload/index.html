<body class="bg-background text-text-primary antialiased min-h-screen flex justify-center selection:bg-accent-tint selection:text-primary">
<!-- Mobile Container (393px iOS simulated viewport) -->
<main class="w-full max-w-[393px] min-h-screen bg-background relative flex flex-col justify-between overflow-x-hidden pb-8">
<!-- Header / Top Bar following Shared Components JSON instructions -->
<header class="w-full bg-background border-b border-border-hairline px-margin pt-10 pb-3 flex items-center justify-between z-20">
<!-- Leading: Close icon button -->
<button aria-label="Close" class="w-9 h-9 rounded-full flex items-center justify-center text-text-primary hover:text-primary active:opacity-80 transition-colors" type="button">
<span class="material-symbols-outlined text-[22px]" data-icon="close">close</span>
</button>
<!-- Center: Screen Headline in Spectral Display font -->
<h1 class="font-display text-[23px] leading-[28px] font-semibold text-text-primary tracking-tight text-center">
        Your photo
      </h1>
<!-- Trailing: Help text link -->
<button class="text-text-secondary hover:text-primary font-label text-label font-medium px-2 py-1 active:opacity-80 transition-colors" type="button">
        Help
      </button>
</header>
<!-- Main Content Canvas -->
<div class="flex-1 px-margin pt-4 pb-2 flex flex-col">
<!-- Subtitle Description -->
<p class="font-caption text-caption text-text-secondary mb-4 leading-[20px]">
        Check that your photo meets the clinic-grade preview requirements.
      </p>
<!-- Hero Focal Element: Portrait Photo Frame -->
<div class="relative w-full aspect-[3/3.8] rounded-[24px] overflow-hidden bg-surface-alt border border-border-hairline custom-shadow-soft mb-4 flex items-center justify-center">

<!-- Oval Face Alignment Guide Overlay -->

<div class="w-[58%] h-[72%] rounded-[50%] border-2 border-dashed border-[#10A56A] opacity-80 shadow-[0_0_12px_rgba(16,165,106,0.35)]"></div>
</div>
<!-- AI Quality Checked Subtle Bottom Badge -->
<div class="absolute bottom-3 left-3 bg-text-primary/75 backdrop-blur-md px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm">
<span class="material-symbols-outlined text-secondary-fixed text-[15px]" data-icon="verified" data-weight="fill" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-caption text-[11px] font-medium text-white tracking-wide">
            AI quality checked
          </span>
</div>
</div>
<!-- Quality Checklist Section Card -->
<section class="w-full bg-surface rounded-[20px] border border-border-hairline p-3.5 mb-4 custom-shadow-soft">
<div class="grid grid-cols-3 gap-2">
<!-- Item 1: Face centered -->
<div class="flex flex-col items-center text-center p-1.5">
<div class="w-7 h-7 rounded-full bg-status-success-bg flex items-center justify-center text-status-success-text mb-1.5">
<span class="material-symbols-outlined text-[17px] font-semibold" data-icon="check">check</span>
</div>
<span class="font-label text-[12px] leading-[16px] font-medium text-text-primary">
              Face centered
            </span>
</div>
<!-- Item 2: Even lighting -->
<div class="flex flex-col items-center text-center p-1.5 border-x border-border-hairline">
<div class="w-7 h-7 rounded-full bg-status-success-bg flex items-center justify-center text-status-success-text mb-1.5">
<span class="material-symbols-outlined text-[17px] font-semibold" data-icon="check">check</span>
</div>
<span class="font-label text-[12px] leading-[16px] font-medium text-text-primary">
              Even lighting
            </span>
</div>

<div class="flex flex-col items-center text-center p-1.5">
<div class="w-7 h-7 rounded-full bg-status-success-bg flex items-center justify-center text-status-success-text mb-1.5">
<span class="material-symbols-outlined text-[17px] font-semibold" data-icon="check">check</span>
</div>
<span class="font-label text-[12px] leading-[16px] font-medium text-text-primary">

<span class="material-symbols-outlined text-[18px]" data-icon="photo_camera">photo_camera</span>

<button class="h-[44px] rounded-full bg-surface border-[1.5px] border-accent-fill text-accent-fill font-label text-[14px] font-medium flex items-center justify-center gap-1.5 active:bg-accent-tint transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="photo_library">photo_library</span>

          </span>
</div>
